<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registro | Ferretería Los Maestros</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                        <img src="assets/img/logo-ferreteria-los-maestros.png" alt="Logo de Ferretería Los Maestros">
                        <span>Los Maestros <small>Materiales y herramientas</small></span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="menu-principal">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link active" href="registro.html">Registrarse</a></li>
                            <li class="nav-item"><a class="nav-link" href="login.html">Ingresar</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="espacio-seccion">
            <div class="container">
                <div class="tarjeta-formulario">
                    <h1 class="titulo-seccion">Registro de usuario</h1>
                    <form id="form-registro" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="run">RUN</label>
                                <input class="form-control" id="run" name="run" type="text" minlength="7" maxlength="9" placeholder="19011022K" autocomplete="off" required>
                                <small class="error-campo" data-error-for="run"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nombre">Nombre</label>
                                <input class="form-control" id="nombre" name="nombre" type="text" maxlength="50" autocomplete="given-name" required>
                                <small class="error-campo" data-error-for="nombre"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="apellidos">Apellidos</label>
                                <input class="form-control" id="apellidos" name="apellidos" type="text" maxlength="100" autocomplete="family-name" required>
                                <small class="error-campo" data-error-for="apellidos"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="correo">Correo</label>
                                <input class="form-control" id="correo" name="correo" type="email" maxlength="100" autocomplete="email" required>
                                <small class="error-campo" data-error-for="correo"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="contrasena">Contraseña</label>
                                <input class="form-control" id="contrasena" name="contrasena" type="password" minlength="4" maxlength="10" autocomplete="new-password" required>
                                <small class="error-campo" data-error-for="contrasena"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="confirmar-clave">Confirmar contraseña</label>
                                <input class="form-control" id="confirmar-clave" name="confirmarClave" type="password" minlength="4" maxlength="10" autocomplete="new-password" required>
                                <small class="error-campo" data-error-for="confirmarClave"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="region">Región</label>
                                <select class="form-select" id="region" name="region" required>
                                    <option value="">Selecciona una región</option>
                                    <option>Coquimbo</option>
                                    <option>Valparaíso</option>
                                    <option>Metropolitana</option>
                                </select>
                                <small class="error-campo" data-error-for="region"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="comuna">Comuna</label>
                                <select class="form-select" id="comuna" name="comuna" required>
                                    <option value="">Selecciona una comuna</option>
                                    <option>La Serena</option>
                                    <option>Coquimbo</option>
                                    <option>Ovalle</option>
                                    <option>Valparaíso</option>
                                    <option>Viña del Mar</option>
                                    <option>Santiago</option>
                                </select>
                                <small class="error-campo" data-error-for="comuna"></small>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="direccion">Dirección</label>
                                <input class="form-control" id="direccion" name="direccion" type="text" maxlength="300" autocomplete="street-address" required>
                                <small class="error-campo" data-error-for="direccion"></small>
                            </div>
                        </div>
                        <input name="tipo" type="hidden" value="Cliente">
                        <button class="btn boton-principal mt-4" type="submit">Registrarme</button>
                        <p class="mensaje-formulario" data-mensaje aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </main>
        <footer class="pie">
            <div class="container">
                <h2 class="h5">Ferretería Los Maestros</h2>
                <small>© <span data-anio></span> · La Serena</small>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="main.js"></script>
    </body>
</html>
