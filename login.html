<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inicio de sesión | Ferretería Los Maestros</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                        <img src="assets/img/logo-ferreteria-los-maestros.png" alt="Logo de Ferretería Los Maestros">
                        <span>Los Maestros <small>Materiales y herramientas</small></span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="menu-principal">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                            <li class="nav-item"><a class="nav-link active" href="login.html">Ingresar</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="espacio-seccion">
            <div class="container">
                <div class="tarjeta-formulario">
                    <h1 class="titulo-seccion">Inicio de sesión</h1>
                    <form id="form-login" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="correo">Correo</label>
                            <input class="form-control" id="correo" name="correo" type="email" maxlength="100" autocomplete="email" required>
                            <small class="error-campo" data-error-for="correo"></small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="clave">Contraseña</label>
                            <input class="form-control" id="clave" name="clave" type="password" minlength="4" maxlength="10" autocomplete="current-password" required>
                            <small class="error-campo" data-error-for="clave"></small>
                        </div>
                        <button class="btn boton-principal" type="submit">Ingresar</button>
                        <p class="mensaje-formulario" data-mensaje aria-live="polite"></p>
                    </form>
                    <p class="mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
                </div>
            </div>
        </main>
        <footer class="pie">
            <div class="container">
                <h2 class="h5">Ferretería Los Maestros</h2>
                <small>© <span data-anio></span> · La Serena</small>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="main.js"></script>
    </body>
</html>
